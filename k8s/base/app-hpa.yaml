apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oficina-api
spec:
  maxReplicas: 5
  metrics:
# Escala com base na utilização de CPU
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
# Escala com base na utilização de memória
  - resource:                    
      name: memory
      target:
        averageUtilization: 80
        type: Utilization
    type: Resource
  minReplicas: 1
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oficina-api
