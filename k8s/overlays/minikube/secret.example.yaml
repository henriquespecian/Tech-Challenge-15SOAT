# MODELO do Secret do ambiente local (Minikube + Postgres in-cluster).
# Copie para secret.yaml e preencha com os valores REAIS em base64:
#   cp secret.example.yaml secret.yaml
#
# Gere os valores base64 assim (nao inclua quebra de linha):
#   echo -n 'senha-do-postgres-local' | base64
#   echo -n 'seu-jwt-secret'          | base64
#
# O secret.yaml real esta no .gitignore e NAO deve ser commitado.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secret
type: Opaque
data:
  JWT_SECRET: <base64-do-jwt-secret>
  SPRING_DATASOURCE_PASSWORD: <base64-da-senha-do-postgres-local>
